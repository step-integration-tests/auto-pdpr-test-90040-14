name: repro
on:
  push:
    branches: [ main ]
permissions:
  contents: read

jobs:
  build:
    runs-on: my-custom-runner          # ← NOT in runnerLabels
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - run: echo "build"
  publish:
    runs-on: [self-hosted, linux, x64] # ← also not in runnerLabels
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - run: echo "publish"
