name: Test Workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hello_world:
    runs-on: ubuntu-latest
    container: node:18

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Hello
        shell: bash
        run: echo "HI"
